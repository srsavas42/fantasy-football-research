[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ffmodel"
version = "0.1.0"
description = "Fantasy football distributional modeling: volume, efficiency, and outcome simulation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=1.5",
    "numpy>=1.24",
    "nflreadpy>=0.1.5,<1",
    "pyarrow>=12",
]

[project.scripts]
ffmodel-data = "ffmodel.data.pull:main"
ffmodel-coaches = "ffmodel.data.wikipedia_coaching:main"

[project.optional-dependencies]
models = [
    "pymc>=5.10",
    "arviz>=0.17",
]
dev = [
    "pytest>=7.4",
]
scrape = [
    "requests>=2.28",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "html5lib>=1.1",
    "mwparserfromhell>=0.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
