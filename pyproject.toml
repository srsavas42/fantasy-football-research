[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ffmodel"
version = "0.1.0"
description = "Fantasy football distributional modeling: volume, efficiency, and outcome simulation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=1.5",
    "numpy>=1.24",
    "nflreadpy>=0.1.5,<1",
    "pyarrow>=12",
]

[project.scripts]
ffmodel-data = "ffmodel.data.pull:main"
ffmodel-coaches = "ffmodel.data.wikipedia_coaching:main"

[project.optional-dependencies]
models = [
    "pymc>=5.10",
    "arviz>=0.17,<1",
]
ml = [
    "xgboost>=2,<4",
]
dev = [
    "pytest>=7.4",
    "ruff>=0.15",
]
scrape = [
    "requests>=2.28",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "html5lib>=1.1",
    "mwparserfromhell>=0.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.cache/pytest-tmp -p no:cacheprovider -m 'not slow'"
markers = [
    "slow: sampler-heavy Bayesian integration tests; run explicitly with -m slow",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Ruff's default rules (pycodestyle E4/E7/E9 and pyflakes F) less the ones this
# codebase deliberately does not follow. Everything dropped here is a
# formatting preference. Nothing that reports a defect is silenced: the whole
# pyflakes set stays on, which is what catches an undefined name, a dead local
# or an import nobody uses.
ignore = [
    # `try: value = ...` / `except Error: raise ...` written on one line, and
    # the same with semicolons. Used throughout release/schemas.py, where the
    # wire format is deliberately kept to one line per field, and in the
    # one-off screen_* scripts.
    "E701",
    "E702",
    # A named lambda where a def would also do.
    "E731",
]

[tool.ruff.lint.per-file-ignores]
# Both of these must run a statement before importing heavy dependencies, and
# it only works first: scripts silence import-time warnings from numpy/pandas/
# pymc, and tests call pytest.importorskip so an optional dependency skips the
# module cleanly instead of failing to import it.
"scripts/*" = ["E402", "E401"]
"tests/*" = ["E402"]
